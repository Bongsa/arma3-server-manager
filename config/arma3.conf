# Central configuration for arma3-manager. Do not store passwords or 2FA codes
# here. Every value can also be supplied through an environment variable.

STEAM_USER="${STEAM_USER:-HereYourSteamUser}"
ARMA_APP_ID="${ARMA_APP_ID:-233780}"
WORKSHOP_APP_ID="${WORKSHOP_APP_ID:-107410}"

ARMA_BASE="${ARMA_BASE:-Insert Path}"
ARMA_DIR="${ARMA_DIR:-$ARMA_BASE/server}"
STEAMCMD_DIR="${STEAMCMD_DIR:-$ARMA_BASE/steamcmd}"
# A dedicated HOME prevents SteamCMD from using the desktop Steam library and
# its Workshop files. It also contains the cached login session.
STEAMCMD_HOME="${STEAMCMD_HOME:-$ARMA_BASE/steam-home}"
# This is the content of steamapps/workshop, not steamapps itself.
WORKSHOP_DIR="${WORKSHOP_DIR:-$ARMA_BASE/workshop}"
# Arma on Linux requires -mod paths inside the server directory.
MOD_LINK_DIR="${MOD_LINK_DIR:-$ARMA_DIR/mods}"
SERVER_MOD_LINK_DIR="${SERVER_MOD_LINK_DIR:-$ARMA_DIR/servermods}"
LOG_DIR="${LOG_DIR:-$ARMA_BASE/logs}"
# Documented target only: according to BI, -profiles is broken on Linux.
PROFILE_DIR="${PROFILE_DIR:-$ARMA_BASE/profiles}"
STATE_DIR="${STATE_DIR:-$ARMA_BASE/state}"

SERVER_CONFIG="${SERVER_CONFIG:-server.cfg}"
BASIC_CONFIG="${BASIC_CONFIG:-basic.cfg}"
PORT="${PORT:-2302}"
SERVER_BINARY="${SERVER_BINARY:-arma3server_x64}"
SERVER_NAME="${SERVER_NAME:-server}"

# Additional arguments are defined as a Bash array, never as an executable string.
ARMA_EXTRA_ARGS=("-name=$SERVER_NAME" "-noSound")

MIN_FREE_GB="${MIN_FREE_GB:-10}"
STOP_TIMEOUT="${STOP_TIMEOUT:-30}"
# Timer updates never restart a running server without explicit authorization.
AUTO_RESTART="${AUTO_RESTART:-false}"
# Interactive SteamCMD percentage display. Under systemd, the manager
# automatically falls back to regular line-based output.
SHOW_PROGRESS="${SHOW_PROGRESS:-true}"

# SteamCMD URL from the Valve Developer Community documentation.
STEAMCMD_URL="${STEAMCMD_URL:-https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz}"
